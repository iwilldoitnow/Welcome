<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Automatyzacja raportowania ESG - Portfolio</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <div class="brand">
          <span class="brand-mark">SK</span>
          <div>
            <p class="brand-title">Slawomir Komisarcz</p>
            <p class="brand-subtitle" data-i18n="tagline">Analityk biznesowy &amp; danych</p>
          </div>
        </div>
        <button class="lang-toggle" type="button" data-lang-toggle>EN</button>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <a class="text-link" href="../index.html" data-i18n="projectPages.back">Powrót do strony głównej</a>
        <h1 data-i18n="project3.title">Automatyzacja raportowania ESG</h1>
        <p class="lead" data-i18n="project3.summary"></p>

        <section class="section">
          <h2 data-i18n="projectPages.overview">Opis projektu</h2>
          <p data-i18n="project3.overview"></p>
        </section>

        <section class="section alt">
          <h2 data-i18n="projectPages.goals">Cele i rezultaty</h2>
          <ul class="highlight">
            <li data-i18n="project3.goals.0"></li>
            <li data-i18n="project3.goals.1"></li>
            <li data-i18n="project3.goals.2"></li>
          </ul>
        </section>

        <section class="section">
          <h2 data-i18n="projectPages.tools">Narzędzia i technologie</h2>
          <div class="grid three">
            <div class="card" data-i18n="project3.tools.0"></div>
            <div class="card" data-i18n="project3.tools.1"></div>
            <div class="card" data-i18n="project3.tools.2"></div>
            <div class="card" data-i18n="project3.tools.3"></div>
          </div>
        </section>

        <section class="section alt">
          <h2 data-i18n="projectPages.timeline">Kluczowe etapy</h2>
          <div class="timeline">
            <div class="timeline-item">
              <span class="pill">01</span>
              <div data-i18n="project3.timeline.0"></div>
            </div>
            <div class="timeline-item">
              <span class="pill">02</span>
              <div data-i18n="project3.timeline.1"></div>
            </div>
            <div class="timeline-item">
              <span class="pill">03</span>
              <div data-i18n="project3.timeline.2"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>© 2024 Slawomir Komisarcz. Datapulse.pl</p>
      </div>
    </footer>

    <script src="../scripts.js"></script>
  </body>
</html>
